[pytest]
# "live" marks tests that make real, cost-incurring calls to external
# services (the `claude` CLI against the real Claude Pro subscription, the
# real local DataHub instance). Registered explicitly so pytest doesn't warn
# about an unknown marker, and excluded by default via addopts below so a
# plain `pytest tests/` never silently spends real money — run them
# on purpose with `pytest tests/ -m live`.
#
# No pytest.ini/pyproject.toml/setup.cfg existed anywhere in this repo
# before this file (checked before adding it, per project convention of
# verifying rather than assuming) — this is the smallest addition that
# gives marker-based opt-out; a full pyproject.toml with [project.scripts]
# is Slice 4's separate, later job (lld-sprint2.md §4.3), not pulled forward
# here just to have a place to put this.
markers =
    live: makes a real, cost-incurring call to an external service (claude CLI / live DataHub) — excluded by default, run with `-m live`

addopts = -m "not live"
