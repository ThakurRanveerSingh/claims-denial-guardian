[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claims-denial-guardian"
version = "0.1.0"
description = "Sentinel/Investigator agent pipeline for claims denial anomaly detection and root-cause tracing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic==0.118.0",
    "acryl-datahub[sqlalchemy]==1.6.0.15",
    "mcp==1.28.1",
    "python-dotenv==1.2.2",
]

# Sprint 3 WP3 (Reporter, decision 0009): `rich` is OPTIONAL, not a core
# dependency — src/agents/rich_output.py guards its own `import rich` in a
# try/except and falls back to orchestrator.py's plain-text
# print_incident_summary()/print_dry_run_summary() when it isn't
# installed. Listing it as an extra (`pip install -e ".[rich]"`) rather
# than in [project]'s own `dependencies` is what makes that fallback path
# real rather than theoretical — a hard dependency would mean the
# plain-text branch never actually runs for anyone with a normal install.
[project.optional-dependencies]
rich = ["rich==13.9.4"]

# lld-sprint2.md §4.3: a real `guardian` command on PATH via
# `pip install -e .`, not `python -m src.agents.cli run` typed out every
# time — the standard, idiomatic way Python projects expose a command.
# Rejected alternative (§4.3): a `bin/guardian` shell shim — works, but
# isn't on PATH by default either and teaches a project-specific convention
# instead of the standard packaging mechanism.
[project.scripts]
guardian = "agents.cli:main"

[tool.setuptools.packages.find]
# "src layout": the real packages live at src/agents/ and (as of Sprint 3
# WP2) src/codegen/, both with __init__.py, installed as top-level
# `agents`/`codegen`. `where = ["src"]` alone would also auto-discover
# src/datahub/ if it ever grew an __init__.py — it specifically would
# collide with the REAL `datahub` PyPI package (acryl-datahub) that
# add_lineage.py/add_metadata.py/register_ml_model.py already import
# (`from datahub.ingestion...`). `include` restricts discovery to the
# packages this project actually means to install, closing that collision
# risk explicitly rather than relying on "no one's added an __init__.py
# there yet." `codegen` has no such collision risk (not a real PyPI name)
# but is listed explicitly for the same reason `agents` is: intentional,
# not just whatever `where` happens to auto-discover.
where = ["src"]
include = ["agents*", "codegen*"]
